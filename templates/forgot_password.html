<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink | Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .digit-input {
            width: 48px;
            height: 56px;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .digit-input:focus {
            border-color: #0d9488;
            background: white;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }

        @keyframes countdown {
            from {
                stroke-dashoffset: 0;
            }

            to {
                stroke-dashoffset: 339;
            }
        }

        .timer-ring {
            animation: countdown 120s linear forwards;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

    <div class="w-full max-w-md" x-data="resetFlow()">
        <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 p-10 border border-slate-100">
            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-teal-50 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-teal-100">
                    <i class="fas text-2xl text-teal-600"
                        :class="step === 1 ? 'fa-key' : (step === 2 ? 'fa-envelope-open' : 'fa-lock-open')"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight"
                    x-text="step === 1 ? 'Forgot Password?' : (step === 2 ? 'Check Email' : 'New Password')"></h1>
                <p class="text-slate-400 text-sm mt-1 font-medium"
                    x-text="step === 1 ? 'No worries, we will send you a code' : (step === 2 ? 'Enter code sent to ' + email : 'Create a strong new password')">
                </p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div
                class="mb-6 p-4 rounded-2xl bg-red-50 text-red-600 text-[10px] font-black border border-red-100 uppercase tracking-wider text-center">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- Step 1: Send Email -->
            <form action="{{ url_for('forgot_password') }}" method="POST" x-show="step === 1">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Email
                            Address</label>
                        <input type="email" name="email" x-model="email" required placeholder="name@gmail.com"
                            class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-teal-500 font-bold transition-all">
                    </div>
                    <button type="submit"
                        class="w-full py-4 bg-teal-700 text-white rounded-xl font-black uppercase tracking-widest text-xs hover:bg-teal-800 transition-all shadow-lg shadow-teal-700/20">
                        Send Reset Code
                    </button>
                    <a href="{{ url_for('login') }}"
                        class="block text-center text-xs font-bold text-slate-400 hover:text-teal-600">Back to Login</a>
                </div>
            </form>

            <!-- Step 2: Verify OTP -->
            <form action="{{ url_for('verify_reset_otp') }}" method="POST" x-show="step === 2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="email" :value="email">

                <div class="flex justify-center mb-6">
                    <div class="relative w-20 h-20">
                        <svg class="w-20 h-20 -rotate-90" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="54" fill="none" stroke="#f1f5f9" stroke-width="8" />
                            <circle cx="60" cy="60" r="54" fill="none" stroke="#0d9488" stroke-width="8"
                                stroke-dasharray="339" stroke-dashoffset="0" stroke-linecap="round"
                                class="timer-ring" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center text-sm font-black text-slate-900"
                            x-text="timeLeft + 's'"></div>
                    </div>
                </div>

                <div class="flex justify-between gap-2 mb-6">
                    <template x-for="(d, i) in digits" :key="i">
                        <input type="text" maxlength="1" class="digit-input" x-model="digits[i]"
                            @input="handleDigitInput($event, i)" @keydown="handleDigitKeydown($event, i)"
                            :id="'digit-' + i">
                    </template>
                </div>
                <input type="hidden" name="otp_code" :value="digits.join('')">

                <button type="submit" :disabled="digits.join('').length < 6 || timeLeft <= 0"
                    class="w-full py-4 bg-teal-700 text-white rounded-xl font-black uppercase tracking-widest text-xs hover:bg-teal-800 transition-all disabled:opacity-40 shadow-lg shadow-teal-700/20">
                    Verify Code
                </button>
                <div class="mt-4 text-center">
                    <button type="button" @click="step = 1"
                        class="text-xs font-bold text-slate-400 hover:text-teal-600">Change Email</button>
                </div>
            </form>

            <!-- Step 3: New Password -->
            <form action="{{ url_for('reset_password') }}" method="POST" x-show="step === 3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="token" :value="resetToken">
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">New
                            Password</label>
                        <div class="relative">
                            <input :type="show1 ? 'text' : 'password'" name="password" x-model="p1" required
                                placeholder="••••••••"
                                class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-teal-500 font-bold pr-12 transition-all">
                            <button type="button" @click="show1 = !show1"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas" :class="show1 ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label
                            class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirm
                            New Password</label>
                        <div class="relative">
                            <input :type="show2 ? 'text' : 'password'" name="confirm_password" x-model="p2" required
                                placeholder="••••••••"
                                class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-teal-500 font-bold pr-12 transition-all">
                            <button type="button" @click="show2 = !show2"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas" :class="show2 ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <div class="space-y-1 pt-2">
                        <p x-show="p1.length > 0 && p1.length < 8" class="text-red-500 text-[10px] font-bold">Must be at
                            least 8 characters</p>
                        <p x-show="p2.length > 0 && p1 !== p2" class="text-red-500 text-[10px] font-bold">Passwords do
                            not match</p>
                    </div>

                    <button type="submit" :disabled="p1.length < 8 || p1 !== p2"
                        class="w-full py-4 bg-teal-700 text-white rounded-xl font-black uppercase tracking-widest text-xs hover:bg-teal-800 transition-all disabled:opacity-40 shadow-lg shadow-teal-700/20">
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function resetFlow() {
            return {
                step: {{ step or 1 }},

        email: '{{ email or "" }}',
            resetToken: '{{ token or "" }}',
                digits: ['', '', '', '', '', ''],
                    timeLeft: 120,
                        show1: false,
                            show2: false,
                                p1: '',
                                    p2: '',

                                        init() {
            if (this.step === 2) {
                this.startTimer();
                this.$nextTick(() => document.getElementById('digit-0')?.focus());
            }
        },

        startTimer() {
            let interval = setInterval(() => {
                this.timeLeft--;
                if (this.timeLeft <= 0) clearInterval(interval);
            }, 1000);
        },

        handleDigitInput(e, i) {
            const val = e.target.value.replace(/[^0-9]/g, '');
            this.digits[i] = val;
            this.digits = [...this.digits];
            if (val && i < 5) document.getElementById(`digit-${i + 1}`)?.focus();
        },

        handleDigitKeydown(e, i) {
            if (e.key === 'Backspace' && !this.digits[i] && i > 0) {
                document.getElementById(`digit-${i - 1}`)?.focus();
            }
        }
            }
        }
    </script>
</body>

</html>
