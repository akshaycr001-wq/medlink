<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - System Component Failure | MedLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-mesh {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.05) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.05) 0, transparent 50%);
        }
    </style>
</head>

<body class="bg-mesh min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-12">
        <div class="relative">
            <div class="absolute inset-0 bg-red-400/20 blur-[100px] rounded-full"></div>
            <div class="relative text-[12rem] font-black tracking-tighter text-slate-900 leading-none select-none">
                500
            </div>
            <p class="text-xs font-black uppercase tracking-[0.4em] text-red-600 mt-4">Module Integrity Failure</p>
        </div>

        <div class="space-y-6">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">System Breakdown</h1>
            <p class="text-slate-500 font-medium leading-relaxed">
                A critical exception has been detected in the core server module. Our technicians are currently
                monitoring the incident.
            </p>
        </div>

        <div class="flex flex-col gap-4">
            <a href="/"
                class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black uppercase tracking-widest text-xs shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition-all active:scale-95">
                Resume Communication
            </a>
            <button onclick="window.location.reload()"
                class="w-full py-5 bg-white border border-slate-200 text-slate-600 rounded-3xl font-black uppercase tracking-widest text-xs hover:bg-slate-50 transition-all active:scale-95">
                Regenerate Signal
            </button>
        </div>

        <div class="pt-8 border-t border-slate-200">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">MedLink Oversight Network &copy;
                2026</p>
        </div>
    </div>
</body>

</html>
